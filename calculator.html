<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple JS Calculator</title>
  <style>
    /* very minimal “SO-like” styling */
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #eee;
      margin: 0;
    }

    .calculator {
      width: 250px;
      border: 1px solid #999;
      border-radius: 4px;
      background: #fff;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }

    .display {
      width: calc(100% - 20px);
      margin: 10px;
      padding: 10px;
      font-size: 1.5em;
      text-align: right;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #f9f9f9;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #ccc;
    }

    .keys button {
      font-size: 1.2em;
      padding: 15px;
      border: none;
      background: #fafafa;
      cursor: pointer;
    }

    .keys button:hover {
      background: #f0f0f0;
    }

    /* highlight operator buttons */
    .keys .operator {
      background: #f1c40f;
      color: #fff;
    }

    .keys .equal {
      background: #27ae60;
      color: #fff;
      grid-column: span 2;
    }

    .keys .clear {
      background: #e74c3c;
      color: #fff;
      grid-column: span 2;
    }

    /* disable cursor/opacity when decimal not allowed */
    .keys button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div id="display" class="display">0</div>

    <div class="keys">
      <!-- Clear (C) spans two columns -->
      <button id="btn-clear" class="clear">C</button>
      <!-- Division and Multiplication -->
      <button class="operator" data-op="/">÷</button>
      <button class="operator" data-op="*">×</button>

      <!-- Numbers 7-9 and subtraction -->
      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="operator" data-op="-">−</button>

      <!-- Numbers 4-6 and addition -->
      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="operator" data-op="+">+</button>

      <!-- Numbers 1-3 and equals -->
      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button id="btn-equal" class="equal">=</button>

      <!-- Zero spans two columns, decimal point -->
      <button data-num="0" style="grid-column: span 2;">0</button>
      <button id="btn-decimal">.</button>
    </div>
  </div>

  <script>
    (function() {
      const display = document.getElementById('display');
      const btnClear = document.getElementById('btn-clear');
      const btnEqual = document.getElementById('btn-equal');
      const btnDecimal = document.getElementById('btn-decimal');
      const numButtons = document.querySelectorAll('[data-num]');
      const opButtons  = document.querySelectorAll('.operator');

      let currentValue  = '0';    // string of what’s on-screen
      let previousValue = null;   // number stored when operator clicked
      let operator      = null;   // '+', '-', '*', or '/'
      let decimalUsed   = false;  // if the current operand already has a “.”

      // update the display (avoid leading zeros except “0” itself)
      function updateDisplay() {
        display.textContent = currentValue;
      }

      // append a digit (0–9) to the current value
      function appendDigit(d) {
        if (currentValue === '0') {
          currentValue = d;
        } else {
          currentValue += d;
        }
      }

      // click handler for number buttons
      numButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          appendDigit(btn.dataset.num);
          updateDisplay();
        });
      });

      // handle decimal point: only allow once per operand
      btnDecimal.addEventListener('click', () => {
        if (!decimalUsed) {
          decimalUsed = true;
          currentValue += '.';
          updateDisplay();
        }
        // if decimalUsed is already true, do nothing
      });

      // when an operator is clicked
      opButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const op = btn.dataset.op;
          // if there’s already a saved operator and previousValue, compute first
          if (operator && previousValue !== null) {
            compute();
          }
          operator = op;
          previousValue = parseFloat(currentValue);
          currentValue = '0';
          decimalUsed = false;
          updateDisplay();
        });
      });

      // compute previousValue (operator) currentValue
      function compute() {
        const curr = parseFloat(currentValue);
        let result;

        switch (operator) {
          case '+':
            result = previousValue + curr;
            break;
          case '-':
            result = previousValue - curr;
            break;
          case '*':
            result = previousValue * curr;
            break;
          case '/':
            result = (curr === 0) ? 'Error' : previousValue / curr;
            break;
          default:
            return;
        }

        // show 'Error' for divide-by-zero, otherwise trim unnecessary “.0”
        if (result === 'Error') {
          currentValue = 'Error';
        } else {
          currentValue = String(result);
          // if the result has a decimal, mark decimalUsed = true
          decimalUsed = currentValue.includes('.');
        }
        operator = null;
        previousValue = null;
      }

      // “=” button
      btnEqual.addEventListener('click', () => {
        if (operator && previousValue !== null) {
          compute();
          updateDisplay();
        }
      });

      // “C” button resets everything
      btnClear.addEventListener('click', () => {
        currentValue  = '0';
        previousValue = null;
        operator      = null;
        decimalUsed   = false;
        updateDisplay();
      });

      // initialize display
      updateDisplay();
    })();
  </script>
</body>
</html>
